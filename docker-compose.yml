services:
  app:
    build: ./app
    container_name: ${APP_CONTAINER_NAME:-fhl_api}
    working_dir: /usr/src/app
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./app:/usr/src/app
      - ./.env:/usr/src/app/.env
      - /usr/src/app/node_modules
    env_file:
      - ./.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - PUBLIC_KEY=${PUBLIC_KEY}
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-0.5}"
          memory: ${APP_MEM_LIMIT:-512M}
    networks:
      - backend

  db:
    image: postgres:15-alpine
    container_name: ${DB_CONTAINER_NAME:-fhl_db}
    ports:
      - "${POSTGRES_LOCAL:-5432}:${POSTGRES_PORT:-5432}"
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-fhl_logistics}
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-0.5}"
          memory: ${DB_MEM_LIMIT:-512M}
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
